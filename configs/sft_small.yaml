### model
model_name_or_path: /home/flyingbird/Work/AutoDriver/FSDrive-main/model/FSDrive_pretrain
image_resolution: 65536
video_resolution: 16384
trust_remote_code: true

flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true
gradient_checkpointing: true

### dataset
dataset: train_cot_motion
template: qwen2_vl
cutoff_len: 8192
max_new_tokens: 2048
max_samples: 200
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: /home/flyingbird/Work/AutoDriver/FSDrive-main/model/FSDrive_sft_small
logging_steps: 5
save_steps: 50
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

temperature: 0.1
top_p: 0.1
top_k: 10

skip_special_tokens: false
